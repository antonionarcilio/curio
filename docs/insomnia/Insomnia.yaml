    modified: 1784930713131
environments:
  name: Base Environment
  meta:
    id: env_7879e147c464f669c5f3e3e5017c9360f2e7351f
    created: 1784930713130
    modified: 1784930931849
  data:
    BASE_URL: http://localhost:8787
