type: collection.insomnia.rest/5.0
schema_version: '5.1'
name: endpoints - dev
meta:
  id: wrk_da408a30875f4fdfabe964a34e520835
  created: 1784930713129
  modified: 1784933376599
  description: |-
    API HTTP versionada em `/api/v1` que transmite vídeos guardados no Telegram via MTProto/GramJS, com suporte a Range requests.

    Configure `BASE_URL` (default `http://localhost:8787`) e envie `Authorization: Bearer <ACCESS_TOKEN>` em todas as rotas, exceto `video/stream` e `video/dl` quando acessadas com URL assinada (`?exp=&sig=`).

    Cache: `/api/v1/videos/grouped`, `/api/v1/videos/by/:chatId`, `/api/v1/channels` e a resolução de metadados de stream/download usam cache em memória com TTL. Use `POST /api/v1/cache/purge` para forçar dados frescos.

    Documentação completa: `docs/ROUTES.md`.
collection:
  - url: '{{ _.BASE_URL }}/api/v1/channels'
    name: channels
    meta:
      id: req_channels_v1
      created: 1784930998784
      modified: 1784932822596
      isPrivate: false
      description: |-
        Lista canais/supergrupos.

        Acesso: Privada.
        Query params: `limit`, `channel_id`, `channel_title`, `page`, `per_page`.
        Resposta: array de `{ channel_id, channel_title }` ou envelope paginado.
      sortKey: -1784931209194
    method: GET
    parameters:
      - name: limit
        value: '10'
        description: máximo de diálogos escaneados no total
        disabled: true
      - name: channel_id
        value: '1002283515431'
        description: filtra por ID exato, ignorando sinal
        disabled: true
      - name: channel_title
        value: dev
        description: filtra por título, case/acento-insensitive
        disabled: true
      - name: page
        value: '1'
        description: ativa paginação
        disabled: true
      - name: per_page
        value: '10'
        description: itens por página, até 100
        disabled: true
    settings: &settings
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: '{{ _.BASE_URL }}/api/v1/videos/grouped'
    name: videos grouped
    meta:
      id: req_videos_grouped_v1
      created: 1784931131777
      modified: 1784931787762
      isPrivate: false
      description: |-
        Lista vídeos encontrados em todos os chats/canais, com URL de streaming assinada.

        Acesso: Privada.
        Query params: `limit`, `chat_id`, `chat_title`, `file_name`, `page`, `per_page`.
        Resposta: array de `{ chat_id, chat_title, message_id, file_name, size, mime_type, date, url }` ou envelope paginado.
      sortKey: -1784931131777
    method: GET
    parameters:
      - name: limit
        value: '10'
        description: máximo de vídeos por chat
        disabled: true
      - name: chat_id
        value: ''
        description: filtra por ID exato do chat
        disabled: true
      - name: chat_title
        value: ''
        description: filtra por título
        disabled: true
      - name: file_name
        value: ''
        description: filtra por nome do arquivo
        disabled: true
      - name: page
        value: '1'
        description: ativa paginação em memória
        disabled: true
      - name: per_page
        value: '10'
        description: itens por página, até 100
        disabled: true
    settings: *settings
  - url: '{{ _.BASE_URL }}/api/v1/videos/by/1004325653681'
    name: videos by chat
    meta:
      id: req_videos_by_v1
      created: 1784931286611
      modified: 1784931861463
      isPrivate: false
      description: |-
        Lista vídeos de um chat/canal/username ou `me`.

        Acesso: Privada.
        Query params: `limit`, `file_name`, `thumbnail`, `page`, `per_page`.
        Resposta: `{ chat_id, data }` ou `{ chat_id, data, page, per_page, total, total_pages }`; itens incluem metadados ricos e `url`.
      sortKey: -1784931286611
    method: GET
    parameters:
      - name: limit
        value: '100'
        description: máximo de vídeos a buscar
        disabled: true
      - name: file_name
        value: ''
        description: filtra por nome do arquivo e força paginação em memória
        disabled: true
      - name: thumbnail
        value: 'false'
        description: true baixa thumbnails reais; false retorna thumbnail null
        disabled: true
      - name: page
        value: '1'
        description: ativa paginação
        disabled: true
      - name: per_page
        value: '10'
        description: itens por página, até 100
        disabled: true
    settings: *settings
  - url: '{{ _.BASE_URL }}/api/v1/video/stream/-1004325653681/6'
    name: video stream
    meta:
      id: req_video_stream_v1
      created: 1784933018622
      modified: 1784933303191
      isPrivate: false
      description: |-
        Serve bytes do vídeo com Range request, inline quando o MIME é `video/*`.

        Acesso: Híbrida: Authorization ou URL assinada com `exp` e `sig`.
        Resposta: stream binário (`200` ou `206`).
      sortKey: -1784933018622
    method: GET
    parameters:
      - name: exp
        value: ''
        description: timestamp Unix de expiração
        disabled: true
      - name: sig
        value: ''
        description: HMAC-SHA256 de chatId:messageId:exp
        disabled: true
    settings: *settings
  - url: '{{ _.BASE_URL }}/api/v1/video/dl/-1004325653681/6'
    name: video download
    meta:
      id: req_video_dl_v1
      created: 1784933018623
      modified: 1784933303192
      isPrivate: false
      description: |-
        Baixa bytes do vídeo com Range request e `Content-Disposition: attachment`.

        Acesso: Híbrida: Authorization ou URL assinada com `exp` e `sig`.
        Resposta: stream binário (`200` ou `206`).
      sortKey: -1784933018623
    method: GET
    parameters:
      - name: exp
        value: ''
        description: timestamp Unix de expiração
        disabled: true
      - name: sig
        value: ''
        description: HMAC-SHA256 de chatId:messageId:exp
        disabled: true
    settings: *settings
  - url: '{{ _.BASE_URL }}/api/v1/video/upload/me'
    name: upload video
    meta:
      id: req_video_upload_v1
      created: 1784934100000
      modified: 1784934100000
      isPrivate: false
      description: |-
        Envia vídeo novo para `chatId`.

        Acesso: Privada.
        Corpo: multipart `file` obrigatório, `thumbnail`, `file_name` e `description` opcionais.
        Resposta: `{ chat_id, message_id, file_name, size, mime_type, date, url }`.
      sortKey: -1784934100000
    method: POST
    body:
      mimeType: multipart/form-data
      params:
        - name: file
          type: file
          fileName: ''
        - name: thumbnail
          type: file
          fileName: ''
          disabled: true
        - name: file_name
          value: ''
          disabled: true
        - name: description
          value: ''
          disabled: true
    settings: *settings
  - url: '{{ _.BASE_URL }}/api/v1/video/update/-1004325653681/6'
    name: update video description
    meta:
      id: req_video_update_v1
      created: 1784934200000
      modified: 1784934200000
      isPrivate: false
      description: |-
        Edita a legenda/descrição de um vídeo já enviado.

        Acesso: Privada.
        Corpo: `{ "description": "novo texto" }`.
        Resposta: `{ "edited": true, "chat_id": ..., "message_id": ... }`.
      sortKey: -1784934200000
    method: PATCH
    headers:
      - name: Content-Type
        value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "description": "nova descrição"
        }
    settings: *settings
  - url: '{{ _.BASE_URL }}/api/v1/video/delete/-1004325653681/6'
    name: delete video
    meta:
      id: req_video_delete_v1
      created: 1784934300000
      modified: 1784934300000
      isPrivate: false
      description: |-
        Exclui um vídeo já enviado (`revoke: true`).

        Acesso: Privada.
        Resposta: `{ "deleted": true, "chat_id": ..., "message_id": ... }`.
      sortKey: -1784934300000
    method: DELETE
    settings: *settings
  - url: '{{ _.BASE_URL }}/api/v1/cache/purge'
    name: purge cache
    meta:
      id: req_cache_purge_v1
      created: 1784932864371
      modified: 1784934028112
      isPrivate: false
      description: |-
        Zera todo o cache em memória.

        Acesso: Privada.
        Query params: nenhum.
        Resposta: `{ "purged": true }`.
      sortKey: -1784930713264
    method: POST
    settings: *settings
cookieJar:
  name: Default Jar
  meta:
    id: jar_7879e147c464f669c5f3e3e5017c9360f2e7351f
