  - url: "{{ _.BASE_URL }}/channels"
    name: channels
    meta:
      id: req_662d7a0f0cac4f608d87c7afb24e7736
      created: 1784930998784
      modified: 1784932822596
      isPrivate: false
      description: "lista os canais/supergrupos de que você faz parte. Filtros: channel_id (exato, ignora o -), channel_title (contém, case-insensitive, sem acentos). Paginação em memória via page/per_page."
      sortKey: -1784931209194
    method: GET
    parameters:
      - name: limit
        value: "10"
        description: "máximo de diálogos escaneados no total (default 100). Não é só canais — conta todos os diálogos (canais + grupos + conversas)."
        disabled: true
      - name: per_page
        value: "5"
        description: "itens por página (até 100). Ativa modo paginado (envelope com data, page, per_page, total, total_pages)."
        disabled: true
      - name: page
        value: "2"
        description: "número da página (default 1). Só funciona se per_page ou page forem informados."
        disabled: true
      - name: channel_id
        value: "1002283515431"
        description: "filtra por ID exato do canal (compara só dígitos, -100... e 100... casam igual)."
        disabled: true
      - name: channel_title
        value: dev
        description: "filtra por título contendo o termo (case-insensitive, sem diferenciar acentos)."
        disabled: true
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: "{{ _.BASE_URL }}/videos"
    name: videos
    meta:
      id: req_928ee1ac5380470982b7b2811180626c
      created: 1784931131777
      modified: 1784931787762
      isPrivate: false
      description: "percorre todos os seus chats/canais (getDialogs) e lista os vídeos encontrados em cada um, já com a URL de streaming pronta (assinada). Busca por chat é paralelizada (até TELEGRAM_FETCH_CONCURRENCY chats simultâneos, default 5). Filtros: chat_id (exato), chat_title (contém, case-insensitive, sem acentos), file_name (contém, case-insensitive, sem acentos) — todos AND. Paginação em memória via page/per_page."
      sortKey: -1784931131777
    method: GET
    parameters:
      - name: limit
        value: "10"
        description: "máximo de vídeos por chat (default 100). Passado direto pro filtro nativo do Telegram (InputMessagesFilterVideo)."
        disabled: true
      - name: per_page
        value: "2"
        description: "itens por página (até 100). Ativa modo paginado (envelope com data, page, per_page, total, total_pages). Corte em memória, não nativo."
        disabled: true
      - name: page
        value: "5"
        description: "número da página (default 1). Só funciona se per_page ou page forem informados."
        disabled: true
      - name: file_name
        value: js
        description: "filtra por file_name contendo o termo (case-insensitive, sem diferenciar acentos)."
        disabled: true
      - name: chat_id
        value: ""
        description: "filtra por correspondência exata do ID do chat."
        disabled: true
      - name: chat_title
        value: course
        description: "filtra por chat_title contendo o termo (case-insensitive, sem diferenciar acentos)."
        disabled: true
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
