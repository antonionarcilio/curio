      description: "lista vídeos de qualquer chat (não só canais) por chatId — útil pra descobrir o messageId de um vídeo em \"Saved Messages\" (chatId = me) ou em qualquer conversa."
      sortKey: -1784933419110
    method: GET
    parameters:
