type: collection.insomnia.rest/5.0
schema_version: '5.1'
name: video / dev
meta:
  id: wrk_da408a30875f4fdfabe964a34e520835
  created: 1784930713129
  modified: 1784933376599
  description: |-
    API HTTP versionada em `/api/v1` que transmite vídeos guardados no Telegram via MTProto/TeleProto, com suporte a Range requests.

    Configure `BASE_URL` (default `http://localhost:8787`) e envie `Authorization: Bearer <ACCESS_TOKEN>` em todas as rotas, exceto `video/stream` e `video/dl` quando acessadas com URL assinada (`?exp=&sig=`).

    Cache: `/api/v1/me`, `/api/v1/videos/grouped`, `/api/v1/videos/by/:chatId`, `/api/v1/channels`, `/api/v1/channel/:channel_id` e a resolução de metadados de stream/download usam cache em memória com TTL. Use `POST /api/v1/cache/purge` para forçar dados frescos.

    Documentação completa: `docs/ROUTES.md`.
collection:
  - url: '{{ _.BASE_URL }}/api/v1/health'
    name: health
    meta:
      id: req_health_v1
      created: 1784933376600
      modified: 1784933376600
      isPrivate: false
      description: |-
        Health check de liveness — confirma que o processo está de pé, sem tocar o Telegram.

        Acesso: Privada.
        Query params: nenhum. Exceção aprovada à paginação obrigatória: não é uma listagem nem busca dados no Telegram.
        Resposta: `{ status: "ok" }`.
      sortKey: -1784931209196
    method: GET
    parameters: []
    settings: &settings
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: '{{ _.BASE_URL }}/api/v1/me'
    name: me
    meta:
      id: req_me_v1
      created: 1784933376601
      modified: 1784933376601
      isPrivate: false
      description: |-
        Retorna o perfil da conta Telegram autenticada no servidor.

        Acesso: Privada.
        Query params: nenhum.
        Resposta: `{ id, first_name, last_name, username, premium }`.
        Não expõe telefone nem o objeto bruto do Telegram.
      sortKey: -1784931209195
    method: GET
    parameters: []
    settings: *settings
  - url: '{{ _.BASE_URL }}/api/v1/channels'
    name: channels
    meta:
      id: req_channels_v1
      created: 1784930998784
      modified: 1784932822596
      isPrivate: false
      description: |-
        Lista canais/supergrupos.

        Acesso: Privada.
        Query params: `limit`, `channel_id`, `channel_title`, `page`, `per_page`.
        Resposta: array de `{ channel_id, channel_title }` ou envelope paginado.
      sortKey: -1784931209194
    method: GET
    parameters:
      - name: limit
        value: '10'
        description: máximo de diálogos escaneados no total
        disabled: true
      - name: channel_id
        value: '1002283515431'
        description: filtra por ID exato, ignorando sinal
        disabled: true
      - name: channel_title
        value: dev
        description: filtra por título, case/acento-insensitive
        disabled: true
      - name: page
        value: '1'
        description: ativa paginação
        disabled: true
      - name: per_page
        value: '10'
        description: itens por página, até 100
        disabled: true
    settings: *settings
  - url: '{{ _.BASE_URL }}/api/v1/channel/-1003915432695'
    name: channel detail
    meta:
      id: req_channel_detail_v1
      created: 1784930998785
      modified: 1784933376600
      isPrivate: false
      description: |-
        Retorna detalhes básicos de um canal/supergrupo específico.

        Acesso: Privada.
        Path param: `channel_id` aceita ID numérico, `-100...`, `@username` ou outro peer resolvível pela conta.
        Query params: nenhum; retorna exatamente um item.
        Resposta: `{ channel_id, channel_title, description, username, type, participants_count, admins_count, kicked_count, banned_count, online_count }`.
      sortKey: -1784931209193
    method: GET
    parameters: []
    settings: *settings
  - url: '{{ _.BASE_URL }}/api/v1/videos/grouped'
    name: videos grouped
    meta:
      id: req_videos_grouped_v1
      created: 1784931131777
      modified: 1784931787762
      isPrivate: false
      description: |-
        Lista vídeos encontrados em todos os chats/canais, com URL de streaming assinada.

        Acesso: Privada.
        Query params: `limit`, `chat_id`, `chat_title`, `file_name`, `description`, `page`, `per_page`.
        Resposta: array de `{ chat_id, chat_title, message_id, file_name, size, mime_type, date, description, url }` ou envelope paginado.
      sortKey: -1784931131777
    method: GET
    parameters:
      - name: limit
        value: '10'
        description: máximo de vídeos por chat
        disabled: true
      - name: chat_id
        value: ''
        description: filtra por ID exato do chat
        disabled: true
      - name: chat_title
        value: ''
        description: filtra por título
        disabled: true
      - name: file_name
        value: ''
        description: filtra por nome do arquivo
        disabled: true
      - name: description
        value: '#hashtag'
        description: filtra por descrição/legenda
        disabled: true
      - name: page
        value: '1'
        description: ativa paginação em memória
        disabled: true
      - name: per_page
        value: '10'
        description: itens por página, até 100
        disabled: true
    settings: *settings
  - url: '{{ _.BASE_URL }}/api/v1/videos/by/1004325653681'
    name: videos by chat
    meta:
      id: req_videos_by_v1
      created: 1784931286611
      modified: 1784931861463
      isPrivate: false
      description: |-
        Lista vídeos de um chat/canal/username ou `me`.

        Acesso: Privada.
        Query params: `limit`, `file_name`, `description`, `thumbnail`, `page`, `per_page`.
        Resposta: `{ chat_id, data }` ou `{ chat_id, data, page, per_page, total, total_pages }`; itens incluem metadados ricos e `url`.
      sortKey: -1784931286611
    method: GET
    parameters:
      - name: limit
        value: '100'
        description: máximo de vídeos a buscar
        disabled: true
      - name: file_name
        value: ''
        description: filtra por nome do arquivo e força paginação em memória
        disabled: true
      - name: description
        value: '#javascript'
        description: filtra por descrição/legenda e força paginação em memória
        disabled: true
      - name: thumbnail
        value: 'false'
        description: true baixa thumbnails reais; false retorna thumbnail null
        disabled: true
      - name: page
        value: '1'
        description: ativa paginação
        disabled: true
      - name: per_page
        value: '10'
        description: itens por página, até 100
        disabled: true
    settings: *settings
  - url: '{{ _.BASE_URL }}/api/v1/video/stream/-1003915432695/6'
    name: video stream
    meta:
      id: req_video_stream_v1
      created: 1784933018622
      modified: 1784933303191
      isPrivate: false
      description: |-
        Serve bytes do vídeo com Range request, inline quando o MIME é `video/*`.

        Acesso: Híbrida: Authorization ou URL assinada com `exp` e `sig`.
        Resposta: stream binário (`200` ou `206`).
      sortKey: -1784933018622
    method: GET
    parameters:
      - name: exp
        value: ''
        description: timestamp Unix de expiração
        disabled: true
      - name: sig
        value: ''
        description: HMAC-SHA256 de chatId:messageId:exp
        disabled: true
    settings: *settings
  - url: '{{ _.BASE_URL }}/api/v1/video/dl/-1003915432695/6'
    name: video download
    meta:
      id: req_video_dl_v1
      created: 1784933018623
      modified: 1784933303192
      isPrivate: false
      description: |-
        Baixa bytes do vídeo com Range request e `Content-Disposition: attachment`.

        Acesso: Híbrida: Authorization ou URL assinada com `exp` e `sig`.
        Resposta: stream binário (`200` ou `206`).
      sortKey: -1784933018623
    method: GET
    parameters:
      - name: exp
        value: ''
        description: timestamp Unix de expiração
        disabled: true
      - name: sig
        value: ''
        description: HMAC-SHA256 de chatId:messageId:exp
        disabled: true
    settings: *settings
  - url: '{{ _.BASE_URL }}/api/v1/video/upload/me'
    name: upload video
    meta:
      id: req_video_upload_v1
      created: 1784934100000
      modified: 1784934100000
      isPrivate: false
      description: |-
        Envia vídeo novo para `chatId`. Assíncrona: não segura a resposta até o
        Telegram terminar de receber o arquivo — use "upload progress" com o
        `job_id` retornado para acompanhar e obter o resultado final.

        Acesso: Privada.
        Corpo: multipart `file` obrigatório, `thumbnail`, `description` e `filename` opcionais. O campo `filename`, quando informado e não vazio, renomeia o arquivo enviado; sem ele, ou quando vazio, usa o nome original do multipart.
        Limite do arquivo: 2 GiB para conta normal e 4 GiB para conta Premium. O plano é consultado no Telegram antes de receber o multipart; se indisponível, a rota responde `503`.
        Concorrência: no máximo UPLOAD_CONCURRENCY_LIMIT uploads reais em paralelo (default 1); os demais ficam com o job em `queued`.
        Resposta: `202 Accepted`, `{ job_id, status: "queued" }`.
      sortKey: -1784934100000
    method: POST
    body:
      mimeType: multipart/form-data
      params:
        - name: file
          type: file
          fileName: ''
        - name: thumbnail
          type: file
          fileName: ''
          disabled: true
        - name: description
          value: ''
          disabled: true
        - name: filename
          value: ''
          description: nome opcional do arquivo; vazio usa o nome original do multipart
          disabled: true
    settings: *settings
  - url: '{{ _.BASE_URL }}/api/v1/video/upload/progress/JOB_ID'
    name: upload progress
    meta:
      id: req_video_upload_progress_v1
      created: 1784934150000
      modified: 1784934150000
      isPrivate: false
      description: |-
        Consulta o andamento de um upload iniciado por "upload video".

        Acesso: Privada.
        Resposta: `{ job_id, status, progress }`, status é "queued" | "paused" | "uploading" | "completed" | "error" | "cancelled". Quando "completed", inclui também `{ chat_id, message_id, file_name, size, mime_type, date, url }`; quando "error", inclui `error`. `job_id` desconhecido/expirado retorna 404.
        Retenção: resultado fica disponível por UPLOAD_PROGRESS_TTL_MINUTES (default 5) após concluir.
      sortKey: -1784934150000
    method: GET
    settings: *settings
  - url: '{{ _.BASE_URL }}/api/v1/video/upload/cancel/JOB_ID'
    name: cancel upload
    meta:
      id: req_video_upload_cancel_v1
      created: 1784934175000
      modified: 1784934175000
      isPrivate: false
      description: |-
        Cancela um upload iniciado por "upload video".

        Acesso: Privada.
        Comportamentos: job "queued" é cancelado na hora (upload nunca inicia); job "uploading" continua até terminar (soft cancel — não dá pra abortar tg.uploadFile/tg.sendFile), e ao concluir a mensagem criada é apagada em vez de exposta como resultado; job em "completed"/"error"/"cancelled" retorna 409.
        Resposta: `200`, `{ job_id, status }`, status é "cancelled" ou "uploading" (cancelamento pendente). `job_id` desconhecido retorna 404.
      sortKey: -1784934175000
    method: POST
    settings: *settings
  - url: '{{ _.BASE_URL }}/api/v1/video/upload/pause/JOB_ID'
    name: pause upload
    meta:
      id: req_video_upload_pause_v1
      created: 1784934180000
      modified: 1784934180000
      isPrivate: false
      description: |-
        Pausa um upload que ainda está esperando vaga na fila ("queued"), sem tirá-lo dela. Não é possível pausar um envio já em andamento (mesma limitação do cancel: sem AbortController/signal no GramJS instalado).

        Acesso: Privada.
        Comportamento: um job "paused" fica de fora da disputa por vagas de UPLOAD_CONCURRENCY_LIMIT até ser retomado — jobs atrás dele na fila passam na frente mesmo com uma vaga livre.
        Resposta: `200`, `{ job_id, status: "paused" }`. 404 se o job_id não existe; 409 se não estiver "queued".
      sortKey: -1784934180000
    method: POST
    settings: *settings
  - url: '{{ _.BASE_URL }}/api/v1/video/upload/resume/JOB_ID'
    name: resume upload
    meta:
      id: req_video_upload_resume_v1
      created: 1784934185000
      modified: 1784934185000
      isPrivate: false
      description: |-
        Retoma um job pausado por "pause upload" (ou pelo bulk "pause all uploads"), devolvendo-o para "queued".

        Acesso: Privada.
        Resposta: `200`, `{ job_id, status: "queued" }`. 404 se o job_id não existe; 409 se não estiver "paused".
      sortKey: -1784934185000
    method: POST
    settings: *settings
  - url: '{{ _.BASE_URL }}/api/v1/video/upload/pause'
    name: pause all uploads
    meta:
      id: req_video_upload_pause_all_v1
      created: 1784934190000
      modified: 1784934190000
      isPrivate: false
      description: |-
        Pausa, de uma vez, todo job que estiver "queued" no momento da chamada. Não afeta jobs que entrarem na fila depois.

        Acesso: Privada.
        Resposta: `200`, `{ paused_job_ids: string[] }` (pode ser `[]`).
      sortKey: -1784934190000
    method: POST
    settings: *settings
  - url: '{{ _.BASE_URL }}/api/v1/video/upload/resume'
    name: resume all uploads
    meta:
      id: req_video_upload_resume_all_v1
      created: 1784934195000
      modified: 1784934195000
      isPrivate: false
      description: |-
        Retoma, de uma vez, todo job que estiver "paused" no momento da chamada.

        Acesso: Privada.
        Resposta: `200`, `{ resumed_job_ids: string[] }` (pode ser `[]`).
      sortKey: -1784934195000
    method: POST
    settings: *settings
  - url: '{{ _.BASE_URL }}/api/v1/video/update/-1003915432695/6'
    name: update video description
    meta:
      id: req_video_update_v1
      created: 1784934200000
      modified: 1784934200000
      isPrivate: false
      description: |-
        Edita a legenda/descrição de um vídeo já enviado.

        Acesso: Privada.
        Corpo: `{ "description": "novo texto" }`.
        Resposta: `{ "edited": true, "chat_id": ..., "message_id": ... }`.
      sortKey: -1784934200000
    method: PATCH
    headers:
      - name: Content-Type
        value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "description": "nova descrição"
        }
    settings: *settings
  - url: '{{ _.BASE_URL }}/api/v1/video/delete/-1003915432695/6'
    name: delete video
    meta:
      id: req_video_delete_v1
      created: 1784934300000
      modified: 1784934300000
      isPrivate: false
      description: |-
        Exclui um vídeo já enviado (`revoke: true`).

        Acesso: Privada.
        Resposta: `{ "deleted": true, "chat_id": ..., "message_id": ... }`.
      sortKey: -1784934300000
    method: DELETE
    settings: *settings
  - url: '{{ _.BASE_URL }}/api/v1/cache/purge'
    name: purge cache
    meta:
      id: req_cache_purge_v1
      created: 1784932864371
      modified: 1784934028112
      isPrivate: false
      description: |-
        Zera todo o cache em memória.

        Acesso: Privada.
        Query params: nenhum.
        Resposta: `{ "purged": true }`.
      sortKey: -1784930713264
    method: POST
    settings: *settings
