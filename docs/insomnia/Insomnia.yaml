meta:
  id: wrk_da408a30875f4fdfabe964a34e520835
  created: 1784930713129
  modified: 1784933376599
  description: |-
    API HTTP que transmite vídeos guardados no Telegram (canais privados ou "Saved Messages") via MTProto/GramJS, com suporte a Range requests.

    **Antes de usar**: no environment `Base Environment`, configure `BASE_URL` (default `http://localhost:8787`) e o header `Authorization: Bearer <ACCESS_TOKEN>` (ou variável de environment equivalente) — todas as rotas exigem esse token, exceto a rota de streaming quando acessada via URL assinada (`?exp=&sig=`).

    **Cache**: `/videos`, `/channels`, `/channels/:channelId/videos`, `/list/:chatId` e a resolução de metadados de `/video/:chatId/:messageId` usam cache em memória com TTL (`CACHE_TTL_MS`, default 3 min). Use `POST /cache/purge` pra forçar dados frescos.

    Documentação completa e detalhada de cada rota: `docs/ROUTES.md` no repositório.
collection:
  - url: "{{ _.BASE_URL }}/routes"
    name: routes
    meta:
