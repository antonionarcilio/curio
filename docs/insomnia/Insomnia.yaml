        disabled: true
      - name: per_page
        value: "10"
        description: "itens por página (máx 100)"
        disabled: true
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
