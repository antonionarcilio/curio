        disabled: true
      - name: per_page
        value: ""
        description: "itens por página (máx 100)"
        disabled: true
      - name: page
        value: ""
        description: "número da página (default 1)"
        disabled: true
      - name: file_name
        value: ""
        description: "filtra por file_name contendo o termo (case-insensitive, sem acentos)"
        disabled: true
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: "{{ _.BASE_URL }}/cache/purge"
    name: purge cache
    meta:
      id: req_aa49298d41af477fa834810a393a12b5
      created: 1784932864371
      modified: 1784934028112
      isPrivate: false
      description: "zera imediatamente todo o cache em memória usado pelas rotas de leitura (/videos, /channels, /channels/:channelId/videos, /list/:chatId, e a resolução de metadados de /video/:chatId/:messageId) — a próxima chamada a qualquer uma delas busca dados frescos do Telegram, ignorando o TTL (CACHE_TTL_MS) ainda em vigor. Útil pra forçar atualização depois de enviar um vídeo novo sem esperar o TTL expirar, sem precisar reiniciar o servidor."
      sortKey: -1784930713264
    method: POST
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: "{{ _.BASE_URL }}/video/-1004325653681/6"
    name: video
    meta:
      id: req_85ea8a5fd70d4699b3acce2dc274a9dd
      created: 1784933018622
      modified: 1784933303191
      isPrivate: false
      description: "rota de streaming — serve os bytes do vídeo com suporte a Range (206 Partial Content), buscando sob demanda do Telegram via iterDownload, sem baixar o arquivo inteiro em disco. Aceita Authorization (privada) ou ?exp=&sig= (URL assinada pública)."
      sortKey: -1784933018622
    method: GET
    parameters:
      - name: exp
        value: "1784936362"
        description: "timestamp Unix de expiração (obrigatório via signed URL)"
        disabled: true
      - name: sig
        value: 0b7ac75b6d343e5bd4c45d0f51fbd5e41282326caed97042a37f47b3920b979f
        description: "HMAC-SHA256 de chatId:messageId:exp (ver src/signedUrl.js)"
        disabled: true
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: "{{ _.BASE_URL }}/list/1004325653681"
